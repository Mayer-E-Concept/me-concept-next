<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <!-- Bulb glass + neck clip — arc from lower-left to lower-right going over the top, then taper to neck -->
    <clipPath id="gc">
      <path d="M 244,273 A 113,116 0 1,1 356,273 Q 350,291 337,296 L 263,296 Q 250,291 244,273 Z"/>
    </clipPath>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#555"/>
    </marker>
    <marker id="al" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="7,0 0,3.5 7,7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background + border -->
  <rect width="600" height="420" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="599" height="419" rx="5.5" fill="none" stroke="#d0d8dc" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Überblick unserer Elektroplanungsleistungen</text>

  <!-- ── 6 coloured sections inside glass (2 cols × 3 rows) ── -->
  <!-- Row 1 -->
  <rect x="187" y="56"  width="113" height="116" fill="#a8e0d0" clip-path="url(#gc)"/>
  <rect x="300" y="56"  width="113" height="116" fill="#a8c0e8" clip-path="url(#gc)"/>
  <!-- Row 2 -->
  <rect x="187" y="172" width="113" height="71"  fill="#b8e8a8" clip-path="url(#gc)"/>
  <rect x="300" y="172" width="113" height="71"  fill="#f4c0c0" clip-path="url(#gc)"/>
  <!-- Row 3 -->
  <rect x="187" y="243" width="113" height="53"  fill="#f0d090" clip-path="url(#gc)"/>
  <rect x="300" y="243" width="113" height="53"  fill="#f8ef90" clip-path="url(#gc)"/>

  <!-- Dividing lines (white, clipped to glass) -->
  <line x1="300" y1="56"  x2="300" y2="296" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" clip-path="url(#gc)"/>
  <line x1="187" y1="172" x2="413" y2="172"  stroke="rgba(255,255,255,0.9)" stroke-width="1.5" clip-path="url(#gc)"/>
  <line x1="187" y1="243" x2="413" y2="243"  stroke="rgba(255,255,255,0.9)" stroke-width="1.5" clip-path="url(#gc)"/>

  <!-- Bulb glass outline with neck taper -->
  <path d="M 244,273 A 113,116 0 1,1 356,273 Q 350,291 337,296 L 263,296 Q 250,291 244,273 Z" fill="none" stroke="#b0b8bc" stroke-width="2"/>

  <!-- ── Base (threaded) ── -->
  <rect x="258" y="296" width="84" height="13" rx="1" fill="#d4d8da" stroke="#babebe" stroke-width="1"/>
  <rect x="260" y="310" width="80" height="12" rx="1" fill="#cacece" stroke="#b2b6b8" stroke-width="1"/>
  <rect x="263" y="323" width="74" height="13" rx="1" fill="#c0c4c6" stroke="#a8acae" stroke-width="1"/>
  <rect x="267" y="337" width="66" height="12" rx="2" fill="#b6babc" stroke="#9ea4a6" stroke-width="1"/>
  <rect x="272" y="350" width="56" height="10" rx="3" fill="#a8acae" stroke="#909698" stroke-width="1"/>

  <!-- ── LINE-ART ICONS ── -->

  <!-- TL (cx=246, cy=114): Building facade — Individuelle Beratung -->
  <g stroke="#1a7868" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="233,107 246,97 259,107"/>
    <rect x="233" y="107" width="26" height="20" rx="1"/>
    <rect x="240" y="113" width="6" height="14"/>
    <rect x="249" y="113" width="7" height="6" rx="1"/>
  </g>

  <!-- TR (cx=354, cy=114): Panel with switches — Steckdosen & Schalter -->
  <g stroke="#28488a" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="340" y="101" width="28" height="26" rx="2"/>
    <rect x="344" y="106" width="7" height="4" rx="1"/>
    <rect x="353" y="106" width="7" height="4" rx="1"/>
    <rect x="344" y="114" width="7" height="4" rx="1"/>
    <rect x="353" y="114" width="7" height="4" rx="1"/>
    <circle cx="354" cy="124" r="2.5"/>
  </g>

  <!-- ML (cx=246, cy=208): Pendant lamp — Beleuchtungslösungen -->
  <g stroke="#4a2090" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <line x1="246" y1="196" x2="246" y2="201"/>
    <path d="M 235,215 L 237,201 L 255,201 L 257,215 Z"/>
    <line x1="235" y1="215" x2="257" y2="215"/>
    <line x1="246" y1="215" x2="246" y2="219"/>
    <circle cx="246" cy="222" r="3"/>
  </g>

  <!-- MR (cx=354, cy=208): Blow dryer / hand dryer — Badlüftung -->
  <g stroke="#a83060" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 341,200 L 357,200 Q 368,200 368,208 Q 368,216 357,216 L 341,216 Z"/>
    <line x1="341" y1="205" x2="341" y2="211"/>
    <polyline points="368,204 374,204 376,207 374,210 368,210"/>
    <line x1="345" y1="216" x2="343" y2="222"/>
    <line x1="350" y1="216" x2="349" y2="222"/>
    <line x1="355" y1="216" x2="355" y2="222"/>
  </g>

  <!-- BL (cx=246, cy=260): Power pylon — Elektr. Messtechnik -->
  <g stroke="#a84010" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="246,278 238,248 254,248 246,278"/>
    <line x1="246" y1="278" x2="246" y2="248"/>
    <line x1="239" y1="265" x2="253" y2="265"/>
    <line x1="240" y1="256" x2="252" y2="256"/>
    <line x1="238" y1="248" x2="235" y2="244"/>
    <line x1="254" y1="248" x2="257" y2="244"/>
    <line x1="243" y1="244" x2="249" y2="244"/>
  </g>

  <!-- BR (cx=354, cy=260): Lightning bolt — Hausanschluss -->
  <g stroke="#8a7800" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="359,248 350,263 357,263 348,278"/>
  </g>

  <!-- Base-L (cx=277, cy=319): Radiator — Temperaturregelung -->
  <g stroke="#606060" stroke-width="1.4" fill="none" stroke-linecap="round">
    <rect x="264" y="307" width="26" height="20" rx="2"/>
    <line x1="270" y1="307" x2="270" y2="327"/>
    <line x1="277" y1="307" x2="277" y2="327"/>
    <line x1="284" y1="307" x2="284" y2="327"/>
    <line x1="264" y1="313" x2="290" y2="313"/>
    <line x1="264" y1="319" x2="290" y2="319"/>
  </g>

  <!-- Base-R (cx=323, cy=319): Smart thermostat — Smart-Home-Automation -->
  <g stroke="#606060" stroke-width="1.4" fill="none" stroke-linecap="round">
    <rect x="311" y="305" width="24" height="28" rx="3"/>
    <rect x="314" y="308" width="18" height="14" rx="1"/>
    <circle cx="323" cy="328" r="2"/>
    <line x1="320" y1="303" x2="326" y2="303"/>
  </g>

  <!-- ── LEFT LABELS (black text) ── -->
  <text x="168" y="93"  text-anchor="end" font-size="11.5" fill="#111">Individuelle</text>
  <text x="168" y="107" text-anchor="end" font-size="11.5" fill="#111">Beratung</text>
  <path d="M170,100 L204,111" stroke="#666" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <text x="168" y="176" text-anchor="end" font-size="11.5" fill="#111">Beleuchtungs-</text>
  <text x="168" y="190" text-anchor="end" font-size="11.5" fill="#111">lösungen</text>
  <path d="M170,182 L203,204" stroke="#666" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <text x="168" y="249" text-anchor="end" font-size="11.5" fill="#111">Elektr.</text>
  <text x="168" y="263" text-anchor="end" font-size="11.5" fill="#111">Messtechnik</text>
  <path d="M170,256 L210,258" stroke="#666" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <text x="168" y="313" text-anchor="end" font-size="11.5" fill="#111">Temperatur-</text>
  <text x="168" y="327" text-anchor="end" font-size="11.5" fill="#111">regelung</text>
  <path d="M170,319 L260,319" stroke="#666" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <!-- ── RIGHT LABELS (black text) ── -->
  <text x="432" y="93"  text-anchor="start" font-size="11.5" fill="#111">Steckdosen &amp;</text>
  <text x="432" y="107" text-anchor="start" font-size="11.5" fill="#111">Schalter</text>
  <path d="M430,100 L396,111" stroke="#666" stroke-width="1" fill="none" marker-end="url(#al)"/>

  <text x="432" y="176" text-anchor="start" font-size="11.5" fill="#111">Badlüftung</text>
  <path d="M430,176 L397,204" stroke="#666" stroke-width="1" fill="none" marker-end="url(#al)"/>

  <text x="432" y="249" text-anchor="start" font-size="11.5" fill="#111">Hausanschluss</text>
  <path d="M430,252 L390,260" stroke="#666" stroke-width="1" fill="none" marker-end="url(#al)"/>

  <text x="432" y="313" text-anchor="start" font-size="11.5" fill="#111">Smart-Home-</text>
  <text x="432" y="327" text-anchor="start" font-size="11.5" fill="#111">Automation</text>
  <path d="M430,319 L340,319" stroke="#666" stroke-width="1" fill="none" marker-end="url(#al)"/>

</svg>
