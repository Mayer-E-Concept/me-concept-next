<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <clipPath id="gc">
      <ellipse cx="300" cy="175" rx="108" ry="118"/>
    </clipPath>
    <marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#777"/>
    </marker>
    <marker id="al" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="6,0 0,3 6,6" fill="#777"/>
    </marker>
  </defs>

  <!-- Background + border -->
  <rect width="600" height="420" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="599" height="419" rx="5.5" fill="none" stroke="#d0d8dc" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#222222">Überblick unserer Elektroplanungsleistungen</text>

  <!-- ── Bulb glass — 3 rows × 2 cols ── -->
  <rect x="192" y="57"  width="108" height="118" fill="#b8e8e0" clip-path="url(#gc)"/>
  <rect x="300" y="57"  width="108" height="118" fill="#f8d0be" clip-path="url(#gc)"/>
  <rect x="192" y="175" width="108" height="70"  fill="#dccdf0" clip-path="url(#gc)"/>
  <rect x="300" y="175" width="108" height="70"  fill="#faeab0" clip-path="url(#gc)"/>
  <rect x="192" y="245" width="108" height="50"  fill="#edd5b0" clip-path="url(#gc)"/>
  <rect x="300" y="245" width="108" height="50"  fill="#c8e8f8" clip-path="url(#gc)"/>

  <!-- Grid lines -->
  <line x1="300" y1="57"  x2="300" y2="293" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" clip-path="url(#gc)"/>
  <line x1="192" y1="175" x2="408" y2="175"  stroke="rgba(255,255,255,0.85)" stroke-width="1.5" clip-path="url(#gc)"/>
  <line x1="192" y1="245" x2="408" y2="245"  stroke="rgba(255,255,255,0.85)" stroke-width="1.5" clip-path="url(#gc)"/>

  <!-- Bulb glass outline -->
  <ellipse cx="300" cy="175" rx="108" ry="118" fill="none" stroke="#b0bbbf" stroke-width="2"/>

  <!-- ── Bulb base ── -->
  <rect x="256" y="290" width="88" height="14" rx="2" fill="#d0d4d6" stroke="#bbbfc1" stroke-width="1"/>
  <rect x="260" y="305" width="80" height="12" rx="2" fill="#c4c8ca" stroke="#b0b4b6" stroke-width="1"/>
  <rect x="265" y="318" width="70" height="16" rx="3" fill="#b8bcbe" stroke="#a0a6a8" stroke-width="1"/>
  <rect x="271" y="334" width="58" height="10" rx="3" fill="#a8aeae" stroke="#949898" stroke-width="1"/>

  <!-- ── LINE-ART ICONS ── -->

  <!-- TL: Smart home panel (cx=246, cy=116) — Individuelle Beratung -->
  <g stroke="#1e8070" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="233,124 233,111 246,101 259,111 259,124"/>
    <polyline points="241,124 241,115 251,115 251,124"/>
    <line x1="237" y1="117" x2="239" y2="117"/>
    <line x1="237" y1="120" x2="239" y2="120"/>
  </g>

  <!-- TR: Electrical outlet (cx=354, cy=116) — Steckdosen & Schalter -->
  <g stroke="#b04018" stroke-width="1.7" fill="none" stroke-linecap="round">
    <circle cx="354" cy="116" r="14"/>
    <circle cx="349" cy="113" r="2.2"/>
    <circle cx="359" cy="113" r="2.2"/>
    <path d="M347,120 Q354,126 361,120"/>
  </g>

  <!-- ML: Pendant lamp (cx=246, cy=210) — Beleuchtungslösungen -->
  <g stroke="#5c38a0" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="246" y1="197" x2="246" y2="202"/>
    <path d="M235,216 L237,203 L255,203 L257,216 Z"/>
    <line x1="235" y1="216" x2="257" y2="216"/>
    <line x1="246" y1="216" x2="246" y2="220"/>
    <circle cx="246" cy="222" r="2.5"/>
  </g>

  <!-- MR: Ventilation fan (cx=354, cy=210) — Badlüftung -->
  <g stroke="#9a7800" stroke-width="1.7" fill="none" stroke-linecap="round">
    <circle cx="354" cy="210" r="13"/>
    <circle cx="354" cy="210" r="2.5"/>
    <path d="M354,197 C358,200 359,206 354,207"/>
    <path d="M367,210 C364,214 358,215 357,210"/>
    <path d="M354,223 C350,220 349,214 354,213"/>
    <path d="M341,210 C344,206 350,205 351,210"/>
  </g>

  <!-- BL: Electric meter (cx=246, cy=263) — Elektr. Messtechnik -->
  <g stroke="#9a5010" stroke-width="1.5" fill="none" stroke-linecap="round">
    <rect x="234" y="256" width="24" height="18" rx="2"/>
    <path d="M238,265 A8,8 0 0,1 254,265"/>
    <line x1="246" y1="265" x2="250" y2="259"/>
  </g>

  <!-- BR: Lightning bolt (cx=354, cy=263) — Hausanschluss -->
  <g stroke="#1850a0" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="358,255 351,265 357,265 350,273"/>
  </g>

  <!-- Base-L: Thermometer (cx=278, cy=312) — Temperaturregelung -->
  <g stroke="#666" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M275,296 A3,3 0 0,1 281,296 L283,308 A6,6 0 1,1 273,308 L275,296 Z"/>
    <line x1="281" y1="299" x2="284" y2="299"/>
    <line x1="281" y1="303" x2="284" y2="303"/>
    <line x1="281" y1="307" x2="284" y2="307"/>
  </g>

  <!-- Base-R: Smart device (cx=322, cy=312) — Smart-Home-Automation -->
  <g stroke="#666" stroke-width="1.4" fill="none" stroke-linecap="round">
    <rect x="313" y="297" width="18" height="22" rx="2"/>
    <rect x="315" y="299" width="14" height="12" rx="1"/>
    <circle cx="322" cy="316" r="1.8"/>
    <line x1="319" y1="295" x2="325" y2="295"/>
  </g>

  <!-- ── LEFT LABELS — black text ── -->
  <text x="167" y="95"  text-anchor="end" font-size="11.5" fill="#111">Individuelle</text>
  <text x="167" y="109" text-anchor="end" font-size="11.5" fill="#111">Beratung</text>
  <path d="M169,102 L202,112" stroke="#888" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <text x="167" y="180" text-anchor="end" font-size="11.5" fill="#111">Beleuchtungs-</text>
  <text x="167" y="194" text-anchor="end" font-size="11.5" fill="#111">lösungen</text>
  <path d="M169,186 L202,205" stroke="#888" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <text x="167" y="250" text-anchor="end" font-size="11.5" fill="#111">Elektr.</text>
  <text x="167" y="264" text-anchor="end" font-size="11.5" fill="#111">Messtechnik</text>
  <path d="M169,257 L210,262" stroke="#888" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <text x="167" y="310" text-anchor="end" font-size="11.5" fill="#111">Temperatur-</text>
  <text x="167" y="324" text-anchor="end" font-size="11.5" fill="#111">regelung</text>
  <path d="M169,317 L268,317" stroke="#888" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <!-- ── RIGHT LABELS — black text ── -->
  <text x="433" y="95"  text-anchor="start" font-size="11.5" fill="#111">Steckdosen &amp;</text>
  <text x="433" y="109" text-anchor="start" font-size="11.5" fill="#111">Schalter</text>
  <path d="M431,102 L398,112" stroke="#888" stroke-width="1" fill="none" marker-end="url(#al)"/>

  <text x="433" y="180" text-anchor="start" font-size="11.5" fill="#111">Badlüftung</text>
  <path d="M431,180 L398,205" stroke="#888" stroke-width="1" fill="none" marker-end="url(#al)"/>

  <text x="433" y="250" text-anchor="start" font-size="11.5" fill="#111">Hausanschluss</text>
  <path d="M431,252 L390,262" stroke="#888" stroke-width="1" fill="none" marker-end="url(#al)"/>

  <text x="433" y="310" text-anchor="start" font-size="11.5" fill="#111">Smart-Home-</text>
  <text x="433" y="324" text-anchor="start" font-size="11.5" fill="#111">Automation</text>
  <path d="M431,317 L332,317" stroke="#888" stroke-width="1" fill="none" marker-end="url(#al)"/>

</svg>
