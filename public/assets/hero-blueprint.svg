<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" fill="none" aria-hidden="true">
  <defs>
    <style>
      @keyframes mecPulse  { 0%,100% { opacity: 0.35; r: 4 }   50% { opacity: 1; r: 7 } }
      @keyframes mecPulse2 { 0%,100% { opacity: 0.25; r: 3 }   50% { opacity: 0.9; r: 5 } }
      @keyframes mecDash   { to { stroke-dashoffset: -400 } }

      .trace       { stroke: #0A2A33; stroke-width: 1.3; opacity: 0.88; fill: none; stroke-linecap: round; }
      .trace-soft  { stroke: #0A2A33; stroke-width: 1;   opacity: 0.32; fill: none; }
      .trace-faint { stroke: #0A2A33; stroke-width: 1;   opacity: 0.13; fill: none; }
      .trace-accent{ stroke: #0F4C5C; stroke-width: 1.6; stroke-dasharray: 8 8; animation: mecDash 8s linear infinite; fill: none; }
      .box-fill    { fill: #FFFFFF; }
      .pad         { fill: #0A2A33; }
      .pad-accent  { fill: #0F4C5C; }
      .pulse       { fill: #0F4C5C; animation: mecPulse 2.6s ease-in-out infinite; }
      .pulse.b     { animation-delay: 0.5s; }
      .pulse.c     { animation-delay: 1.0s; }
      .pulse.d     { animation-delay: 1.5s; }
      .pulse.e     { animation-delay: 2.0s; }
      .pulse-olive { fill: #1F7A8A; animation: mecPulse2 3s ease-in-out infinite; }
      .ring        { stroke: #0A2A33; stroke-width: 1;   fill: none; opacity: 0.5; }
      .ring-soft   { stroke: #0A2A33; stroke-width: 1;   fill: none; opacity: 0.16; stroke-dasharray: 3 5; }
      .ring-accent { stroke: #0F4C5C; stroke-width: 1.2; fill: none; opacity: 0.55; }

      .label       { font-family: "Manrope", "Inter", sans-serif; fill: #0A2A33; opacity: 0.78; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; font-size: 11px; }
      .label-sm    { font-family: "Manrope", sans-serif; fill: #0A2A33; opacity: 0.55; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; font-size: 9px; }
      .label-accent{ font-family: "Manrope", sans-serif; fill: #0F4C5C; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; font-size: 14px; }
      .label-olive { font-family: "Manrope", sans-serif; fill: #1F7A8A; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; font-size: 11px; }
      .label-mec   { font-family: "Manrope", sans-serif; fill: #0A2A33; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 800; font-size: 17px; }
      .gutter      { font-family: "Manrope", sans-serif; font-size: 11px; fill: #6A6F78; opacity: 0.7; }

      .sym         { stroke: #0A2A33; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .sym-fill    { fill: #0A2A33; opacity: 0.85; }
    </style>

    <symbol id="outlet" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13" class="sym"/>
      <circle cx="11" cy="14" r="1.4" class="sym-fill"/>
      <circle cx="21" cy="14" r="1.4" class="sym-fill"/>
      <path d="M 11 19 L 21 19" class="sym"/>
    </symbol>
    <symbol id="bulb" viewBox="0 0 32 32">
      <path d="M 16 4 a 8 8 0 0 1 5 14 v 4 h -10 v -4 a 8 8 0 0 1 5 -14 z" class="sym"/>
      <path d="M 12 24 L 20 24 M 13 27 L 19 27" class="sym"/>
    </symbol>
    <symbol id="panel" viewBox="0 0 32 32">
      <rect x="4" y="3" width="24" height="26" rx="2" class="sym"/>
      <path d="M 4 11 L 28 11" class="sym"/>
      <rect x="8" y="14" width="4" height="6" class="sym"/>
      <rect x="14" y="14" width="4" height="6" class="sym"/>
      <rect x="20" y="14" width="4" height="6" class="sym"/>
    </symbol>
    <symbol id="house" viewBox="0 0 32 32">
      <path d="M 4 16 L 16 5 L 28 16 L 28 27 L 4 27 Z" class="sym"/>
      <path d="M 12 27 L 12 19 L 20 19 L 20 27" class="sym"/>
      <circle cx="22" cy="9" r="1.4" class="sym-fill"/>
      <path d="M 24.5 7 a 4 4 0 0 1 0 4" class="sym" stroke-width="0.9"/>
    </symbol>
    <symbol id="check" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13" class="sym"/>
      <path d="M 10 16 L 14 20 L 22 12" class="sym"/>
    </symbol>
  </defs>

  <!-- =========================== BLUEPRINT FRAME =========================== -->
  <g class="trace-soft">
    <path d="M 30 30 L 30 60 M 30 30 L 60 30"/>
    <path d="M 690 30 L 660 30 M 690 30 L 690 60"/>
    <path d="M 30 690 L 30 660 M 30 690 L 60 690"/>
    <path d="M 690 690 L 660 690 M 690 690 L 690 660"/>
    <path d="M 30 360 L 60 360"/>  <path d="M 690 360 L 660 360"/>
    <path d="M 360 30 L 360 60"/>  <path d="M 360 690 L 360 660"/>
  </g>
  <g class="gutter">
    <text x="14"  y="170">01</text>
    <text x="14"  y="360">02</text>
    <text x="14"  y="555">03</text>
    <text x="702" y="170">A</text>
    <text x="702" y="360">B</text>
    <text x="702" y="555">C</text>
  </g>

  <!-- =========================== FLOORPLAN BG =========================== -->
  <g class="trace-faint">
    <path d="M 130 110 L 590 110 L 590 610 L 130 610 Z"/>
    <path d="M 130 280 L 360 280 L 360 110"/>
    <path d="M 360 280 L 590 280"/>
    <path d="M 360 460 L 130 460"/>
    <path d="M 360 280 L 360 460"/>
    <path d="M 360 460 L 360 610"/>
    <path d="M 460 460 L 460 610"/>
    <path d="M 240 280 L 260 280" stroke="#F6F7F7" stroke-width="3"/>
    <path d="M 460 280 L 480 280" stroke="#F6F7F7" stroke-width="3"/>
    <path d="M 360 350 L 360 370" stroke="#F6F7F7" stroke-width="3"/>
    <path d="M 260 460 L 280 460" stroke="#F6F7F7" stroke-width="3"/>
    <path d="M 360 530 L 360 550" stroke="#F6F7F7" stroke-width="3"/>
    <path d="M 200 110 L 200 100 M 280 110 L 280 100 M 440 110 L 440 100 M 520 110 L 520 100"/>
    <path d="M 200 610 L 200 620 M 280 610 L 280 620 M 440 610 L 440 620 M 520 610 L 520 620"/>
  </g>

  <!-- =========================== CONCENTRIC RINGS =========================== -->
  <circle cx="360" cy="360" r="230" class="ring-soft"/>
  <circle cx="360" cy="360" r="160" class="ring"/>
  <circle cx="360" cy="360" r="100" class="ring-accent"/>

  <!-- =========================== CENTER: MEC =========================== -->
  <rect x="305" y="335" width="110" height="50" rx="6" class="trace box-fill"/>
  <text x="360" y="367" text-anchor="middle" class="label-mec">MEC</text>

  <!-- ============== REVIT — primary tool, prominent top node ============== -->
  <path d="M 360 335 L 360 256" class="trace"/>
  <circle cx="360" cy="335" r="3.5" class="pad"/>
  <rect x="265" y="186" width="190" height="70" rx="7" class="trace box-fill"/>
  <text x="360" y="222" text-anchor="middle" class="label-accent">REVIT</text>
  <text x="360" y="244" text-anchor="middle" class="label-sm">BIM · 3D · MEP</text>

  <!-- Animated trace from REVIT going right, terminating at "PROIECTARE" label -->
  <path d="M 455 220 L 595 220 L 595 110" class="trace-accent"/>
  <circle cx="595" cy="220" r="4.5" class="pad-accent"/>
  <text x="540" y="98" class="label" style="font-size:10px;letter-spacing:0.22em">PROIECTARE</text>

  <!-- ============== LEFT BRANCH: HOAI · DIN (wider box) ============== -->
  <path d="M 305 360 L 180 360" class="trace"/>
  <rect x="50" y="338" width="130" height="44" rx="5" class="trace box-fill"/>
  <text x="115" y="365" text-anchor="middle" class="label">HOAI · DIN</text>

  <!-- ============== UPPER-LEFT: VDE standard ============== -->
  <path d="M 305 343 L 200 290 L 200 178" class="trace-soft"/>
  <rect x="155" y="148" width="90" height="34" rx="4" class="trace box-fill"/>
  <text x="200" y="170" text-anchor="middle" class="label">VDE</text>

  <!-- ============== RIGHT BRANCH: ISO 9001:2015 (wider box) ============== -->
  <path d="M 415 360 L 540 360" class="trace"/>
  <rect x="540" y="338" width="135" height="44" rx="5" class="trace box-fill"/>
  <text x="608" y="365" text-anchor="middle" class="label-olive">ISO 9001:2015</text>

  <!-- ============== UPPER-RIGHT: TABLOU ELECTRIC (with panel symbol) ============== -->
  <path d="M 415 343 L 525 290 L 525 220" class="trace-soft"/>
  <rect x="460" y="155" width="135" height="56" rx="5" class="trace box-fill"/>
  <use href="#panel" x="472" y="170" width="26" height="26"/>
  <text x="540" y="178" text-anchor="middle" class="label-sm">TABLOU</text>
  <text x="540" y="195" text-anchor="middle" class="label-sm">ELECTRIC</text>

  <!-- ============== BOTTOM-LEFT: 3D · MEP (with bulb) ============== -->
  <path d="M 320 385 L 240 470" class="trace"/>
  <rect x="62" y="448" width="155" height="48" rx="5" class="trace box-fill"/>
  <use href="#bulb" x="75" y="456" width="32" height="32"/>
  <text x="160" y="478" text-anchor="middle" class="label-olive">3D · MEP</text>

  <!-- ============== BOTTOM-RIGHT: SMART HOME (with house) ============== -->
  <path d="M 400 385 L 480 470" class="trace"/>
  <rect x="505" y="448" width="170" height="48" rx="5" class="trace box-fill"/>
  <use href="#house" x="518" y="456" width="32" height="32"/>
  <text x="600" y="478" text-anchor="middle" class="label">SMART HOME</text>

  <!-- ============== BOTTOM-CENTER: PORTOFOLIU / PROIECTE ============== -->
  <path d="M 360 385 L 360 555" class="trace-soft"/>
  <rect x="290" y="555" width="140" height="40" rx="5" class="trace box-fill"/>
  <text x="360" y="580" text-anchor="middle" class="label">PORTOFOLIU</text>

  <!-- =========================== JUNCTION DOTS (decorative, NOT pulsing) =========================== -->
  <circle cx="360" cy="256" r="3" class="pad"/>
  <circle cx="180" cy="360" r="3" class="pad"/>
  <circle cx="540" cy="360" r="3" class="pad"/>
  <circle cx="240" cy="470" r="3" class="pad"/>
  <circle cx="480" cy="470" r="3" class="pad"/>
  <circle cx="200" cy="290" r="2.5" class="pad"/>
  <circle cx="525" cy="290" r="2.5" class="pad"/>
  <circle cx="360" cy="555" r="3" class="pad"/>

  <!-- =========================== PULSING NODES (on traces, never on labels) =========================== -->
  <!-- On REVIT trace, midway -->
  <circle cx="360" cy="295" r="5" class="pulse"/>
  <!-- On left trace toward HOAI · DIN -->
  <circle cx="245" cy="360" r="5" class="pulse b"/>
  <!-- On right trace toward ISO -->
  <circle cx="475" cy="360" r="5" class="pulse c"/>
  <!-- On bottom-left diagonal toward 3D · MEP -->
  <circle cx="280" cy="426" r="5" class="pulse d"/>
  <!-- On bottom-right diagonal toward SMART HOME -->
  <circle cx="440" cy="426" r="5" class="pulse e"/>
  <!-- Olive accent on bottom trace toward PORTOFOLIU -->
  <circle cx="360" cy="490" r="4" class="pulse-olive"/>

  <!-- =========================== BOTTOM CAPTION =========================== -->
  <text x="40"  y="708" class="label-sm" style="opacity:0.45">MAYER E-CONCEPT · PROIECTARE INSTALAȚII ELECTRICE</text>
  <text x="680" y="708" text-anchor="end" class="label-sm" style="opacity:0.45">REV. 2026 · SCALE 1:1</text>

  <g class="trace-faint">
    <line x1="60" y1="40" x2="660" y2="40" stroke-dasharray="2 6"/>
    <line x1="60" y1="680" x2="660" y2="680" stroke-dasharray="2 6"/>
  </g>
</svg>
